name: Release Web Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: npm test

      - name: Extract release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          TAG_NO_V="${TAG#v}"
          OWNER_LOWER="${{ github.repository_owner }}"
          OWNER_LOWER="${OWNER_LOWER,,}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag_no_v=$TAG_NO_V" >> "$GITHUB_OUTPUT"
          echo "owner_lower=$OWNER_LOWER" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GitHub Packages
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.tag.outputs.owner_lower }}/jenkins-web-pipeline:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ steps.tag.outputs.owner_lower }}/jenkins-web-pipeline:${{ steps.tag.outputs.tag_no_v }}
            ghcr.io/${{ steps.tag.outputs.owner_lower }}/jenkins-web-pipeline:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
